<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendDev | Sistema de Agendamento</title>

  <!-- Bootstrap & Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- CSS Customizado -->
  <link href="front-end/css/custom.css" rel="stylesheet" />
</head> 

<body class="d-flex flex-column min-vh-100">
    
  <!-- BARRA DE ACESSIBILIDADE SUPERIOR -->
  <header class="acessibilidade-bar" style="position: relative; z-index: 99999; pointer-events: auto;">
    <button type="button" id="aumentar-fonte" onclick="mudarFonte('aumentar')" title="Aumentar Fonte">A+</button>
    <button type="button" id="diminuir-fonte" onclick="mudarFonte('diminuir')" title="Diminuir Fonte">A-</button>
    <button type="button" id="alternar-contraste" onclick="alternarTema()" title="Alternar Contraste">
      <i class="bi bi-circle-half"></i>
    </button>
  </header>

  <!-- CONTAINER CENTRAL -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="container-cadastro text-center">

      <!-- LOGOS -->
      <div class="area-logo mb-3">
        <img src="img/agenddev-logo.png" 
             alt="Logo AgendDev" 
             class="logo-claro img-fluid" 
             style="max-width: 250px;"
             onerror="this.onerror=null; this.src='front-end/img/agenddev-logo.png';">

        <img src="img/agenddev-logo-branco sem fd.png" 
             alt="Logo AgendDev Branco" 
             class="logo-escuro img-fluid" 
             style="max-width: 250px; display: none;"
             onerror="this.onerror=null; this.src='front-end/img/agenddev-logo-branco sem fd.png';">
      </div>

      <h1 class="h3 fw-bold mb-2">Sistema de Agendamento</h1>
      <p class="text-muted mb-4 small">Gerencie seus horários e atendimentos com praticidade e segurança.</p>

      <div class="botoes-acao">
        <a href="front-end/login.html" class="btn btn-primary">
          <i class="bi bi-box-arrow-in-right me-2"></i>Fazer Login
        </a>
        <a href="front-end/cadastro.html" class="link-cadastrar small mt-2">
          Ainda não possui uma conta? Cadastre-se
        </a>
      </div>

    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="text-center text-muted py-3">
    <small>© 2025 - AgendDev</small>
  </footer>

  <!-- VLIBRAS -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script de Acessibilidade Embutido de Garantia com Fallback Explicito -->
  <script>
    function alternarTema() {
      document.body.classList.toggle('alto-contraste');
      const ativo = document.body.classList.contains('alto-contraste');
      localStorage.setItem('tema_escuro', ativo ? 'ativo' : 'inativo');
    }

    function mudarFonte(acao) {
      const body = document.body;
      if (acao === 'aumentar') {
        if (body.classList.contains('fonte-media')) {
          body.classList.remove('fonte-media');
          body.classList.add('fonte-grande');
        } else if (!body.classList.contains('fonte-grande')) {
          body.classList.add('fonte-media');
        }
      } else if (acao === 'diminuir') {
        if (body.classList.contains('fonte-grande')) {
          body.classList.remove('fonte-grande');
          body.classList.add('fonte-media');
        } else {
          body.classList.remove('fonte-media');
        }
      }
    }

    // Carrega o tema ao abrir a página
    window.addEventListener('DOMContentLoaded', function () {
      if (localStorage.getItem('tema_escuro') === 'ativo') {
        document.body.classList.add('alto-contraste');
      }
    });
  </script>

  <!-- Script Externo -->
  <script src="front-end/js/acessibilidade.js"></script>
    
</body>
</html>
