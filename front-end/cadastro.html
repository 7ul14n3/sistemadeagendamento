<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Docente | AgendDev</title>
  
  <!-- Bootstrap CSS & Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- CSS Customizado -->
  <link href="css/custom.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">


  <!-- === BARRA DE ACESSIBILIDADE === -->
  <header class="acessibilidade-bar">
  <button type="button" onclick="window.location.href='../index.html'" title="Voltar ao Início">
    <i class="bi bi-house-door-fill me-1"></i> INÍCIO
  </button>
  <button type="button" onclick="mudarFonte('aumentar')" title="Aumentar Fonte">A+</button>
  <button type="button" onclick="mudarFonte('diminuir')" title="Diminuir Fonte">A-</button>
  <button type="button" onclick="alternarTema()" title="Alternar Contraste">
    <i class="bi bi-circle-half"></i>
  </button>
</header>

  <!-- === CONTAINER CENTRALIZADO === -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="container-cadastro">
      
      <h1 class="text-center mb-4">Cadastro</h1>

      <form id="form-cadastro">
        
        <!-- Nome do Docente -->
        <div class="form-group mb-3">
          <label for="nome" class="form-label">Nome do Docente:</label>
          <div class="input-box">
            <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome completo" required />
            <i class="bi bi-person-fill icone-input"></i>
          </div>
        </div>

        <!-- Código do Docente -->
        <div class="form-group mb-3">
          <label for="codigo" class="form-label">Código do Docente:</label>
          <div class="input-box">
            <input type="text" id="codigo" name="codigo" class="form-control" placeholder="Sua matrícula ou código" required />
            <i class="bi bi-card-heading icone-input"></i>
          </div>
        </div>

        <!-- Senha (CPF) -->
        <div class="form-group mb-3">
          <label for="senha" class="form-label">Senha (CPF):</label>
          <div class="input-box">
            <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite apenas os números" required />
            <i class="bi bi-shield-lock-fill icone-input"></i>
          </div>
        </div>

        <!-- E-mail Institucional -->
        <div class="form-group mb-3">
          <label for="email" class="form-label">E-mail Institucional:</label>
          <div class="input-box">
            <input type="email" id="email" name="email" class="form-control" placeholder="docente@instituicao.edu.br" required />
            <i class="bi bi-envelope-fill icone-input"></i>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="botoes-acao mt-4">
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-person-check-fill me-2"></i>Cadastrar
          </button>
          
          <button type="button" class="btn btn-outline-secondary w-100" onclick="window.location.href='login.html'">
            Voltar ao Login
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- === RODAPÉ === -->
  <footer class="text-center text-muted py-3">
    <small>© 2025 - AgendDev</small>
  </footer>

  <!-- === VLIBRAS === -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>
  
 <!-- Substitua o final do seu cadastro.html por isto: -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- O ../ garante que o HTML encontre a pasta /js fora do diretório atual -->
  <script src="../js/acessibilidade.js"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
