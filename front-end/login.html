<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | AgendDev</title>

    <!-- Links do Bootstrap e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Estilo Customizado -->
    <link href="css/custom.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">

   <!-- === BARRA DE ACESSIBILIDADE === -->
  <header class="acessibilidade-bar">
  <button type="button" onclick="window.location.href='../index.html'" title="Voltar ao Início">
    <i class="bi bi-house-door-fill me-1"></i> INÍCIO
  </button>
  <button type="button" onclick="mudarFonte('aumentar')" title="Aumentar Fonte">A+</button>
  <button type="button" onclick="mudarFonte('diminuir')" title="Diminuir Fonte">A-</button>
  <button type="button" onclick="alternarTema()" title="Alternar Contraste">
    <i class="bi bi-circle-half"></i>
  </button>
</header>

    <!-- === CONTEÚDO CENTRALIZADO === -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="container-cadastro">
            
            <h1 class="text-center mb-4">Login</h1>

            <form id="form-login">

                <!-- Campo de E-mail -->
                <div class="form-group mb-3">
                    <label for="usuario-email" class="form-label">E-mail</label>
                    <div class="input-box">
                        <input type="email" id="usuario-email" name="usuario" class="form-control"
                            placeholder="seu.email@exemplo.com" required />
                        <i class="bi bi-person-fill icone-input"></i>
                    </div>
                </div>

                <!-- Campo de Senha -->
                <div class="form-group mb-3">
                    <label for="senha-login" class="form-label">Senha</label>
                    <div class="input-box">
                        <input type="password" id="senha-login" name="senha" class="form-control"
                            placeholder="Digite sua senha" required />
                        <i class="bi bi-lock-fill icone-input"></i>
                    </div>
                </div>

                <!-- Botão de Ação -->
                <div class="botoes-acao mt-4">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                    </button>

                    <div class="text-center mt-3">
                        <p class="mb-0 text-muted small">Não tem uma conta? 
                            <a href="cadastro.html" class="link-cadastrar ms-1">Cadastre-se</a>
                        </p>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <!-- === RODAPÉ === -->
    <footer class="text-center text-muted py-3">
        <small>© 2025 - AgendDev</small>
    </footer>

    <!-- === VLIBRAS === -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>

    <!-- Scripts do Sistema -->
   <!-- Scripts do Sistema -->
   <!-- Substitua o final do seu cadastro.html por isto: -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- O ../ garante que o HTML encontre a pasta /js fora do diretório atual -->
  <script src="../js/acessibilidade.js"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
