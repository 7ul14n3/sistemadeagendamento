<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva de Sala</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />

  <!-- Caminhos Corrigidos para a nova estrutura -->
  <link href="../css/geral.css" rel="stylesheet" />
</head>

<body class="bg-light">

  <div class="acessibilidade-bar">
    <button type="button" class="btn btn-sm btn-outline-light me-2"
      onclick="window.location.href='../../index.html'">INÍCIO</button>
    <button id="aumentar-fonte" class="btn btn-sm btn-outline-light me-2">A+</button>
    <button id="diminuir-fonte" class="btn btn-sm btn-outline-light me-2">A-</button>
    <button id="alternar-contraste" class="btn btn-sm btn-outline-light"><i class="bi bi-circle-half"></i></button>
  </div>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="container-cadastro p-4">
          <h1 class="text-center mb-4" id="titulo-pagina">Reserva de Sala</h1>

          <form id="form-reserva">

            <div class="form-group mb-3">
              <label for="tipo-reserva" class="form-label">Tipo de Reserva:</label>
              <select id="tipo-reserva" name="tipo-reserva" class="form-select" required>
                <option value="">Selecione...</option>
                <option value="Auditório - Sede">Auditório - Sede</option>
                <option value="Laboratório de Informática - Sede">Laboratório de Informática - Sede</option>
                <option value="Laboratório de Informática - Medicina">Laboratório de Informática - Medicina</option>
              </select>
            </div>

            <div class="form-group mb-3">
              <label for="sala" class="form-label">Sala:</label>
              <select id="sala" name="sala" class="form-select" required>
                <option value="">Selecione uma sala...</option>
                <option value="Sala 1">Sala 1</option>
                <option value="Sala 2">Sala 2</option>
              </select>
            </div>

            <div class="form-group mb-3">
              <label for="data" class="form-label">Data:</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                <input type="text" id="data" name="data" class="form-control" placeholder="Selecione a data..."
                  required />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="horario-inicio" class="form-label">Horário de Início:</label>
                  <input type="time" id="horario-inicio" name="horario-inicio" class="form-control" required />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="horario-fim" class="form-label">Horário de Fim:</label>
                  <input type="time" id="horario-fim" name="horario-fim" class="form-control" required />
                </div>
              </div>
            </div>

            <div class="form-group mb-3">
              <label for="materiais" class="form-label">Solicitação de Materiais:</label>
              <textarea id="materiais" name="materiais" class="form-control" rows="3"
                placeholder="Ex: Projetor, Microfone..."></textarea>
            </div>

            <div class="form-group mb-3">
              <label for="finalidade" class="form-label">Finalidade:</label>
              <input type="text" id="finalidade" name="finalidade" class="form-control"
                placeholder="Informe a finalidade da reserva" />
            </div>

            <div class="botoes-acao mt-4">
              <button type="submit" id="botao-enviar" class="btn btn-primary w-100">Enviar Reserva</button>
            </div>

          </form>
        </div>

        <section id="historico-agendamentos" class="mt-5">
          <h3 class="text-center mb-3">Histórico de Agendamentos</h3>
          <div id="lista-agendamentos" class="list-group"></div>
        </section>

      </div>
    </div>
  </div>

  <footer class="mt-5 p-3 text-center text-muted">
    <p>© 2025 - AgendDev </p>
  </footer>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Caminhos Corrigidos para a nova estrutura -->
  <script src="../static/acessibilidade.js"></script>
  <script src="../static/reserva.js"></script>

</body>

</html>
