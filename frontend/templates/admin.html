<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - Gerenciamento</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Caminhos Corrigidos -->
  <link href="../css/geral.css" rel="stylesheet" />
  <link href="../css/admin.css" rel="stylesheet" />
</head>

<body class="bg-light">

  <div class="acessibilidade-bar">
    <button type="button" class="btn btn-sm btn-outline-light me-2"
      onclick="window.location.href='../../index.html'">INÍCIO</button>
    <button id="aumentar-fonte" class="btn btn-sm btn-outline-light me-2">A+</button>
    <button id="diminuir-fonte" class="btn btn-sm btn-outline-light me-2">A-</button>
    <button id="alternar-contraste" class="btn btn-sm btn-outline-light"><i class="bi bi-circle-half"></i></button>
  </div>

  <div class="container-fluid mt-4 px-4">
    <header class="mb-4 text-center">
      <h1 class="display-6 fw-bold" style="color: #003366;">Gerenciamento de Agendamentos</h1>
    </header>

    <main>

      <section id="secao-filtro" class="container-cadastro p-4 mb-4" style="max-width: 100%; margin: 0;">

        <div class="row align-items-end mb-4 border-bottom pb-4">
          <div class="col-md-4 text-start">
            <label for="campo-data-filtro" class="form-label fw-bold">Filtrar por Data:</label>
            <div class="input-group">
              <input type="date" id="campo-data-filtro" class="form-control" />
              <button id="btn-filtrar" class="btn btn-primary">
                <i class="bi bi-search me-1"></i> Filtrar
              </button>
            </div>
          </div>
          <div class="col-md-8 text-md-end mt-3 mt-md-0">
            <span class="text-muted me-2">Novo Usuário?</span>
            <a href="cadastro.html" class="btn btn-success fw-bold px-4 btn-cadastrar">
              <i class="bi bi-person-plus-fill me-2"></i> Cadastrar
            </a>
          </div>
        </div>

        <div class="row g-3 text-start">
          <div class="col-md-12 mb-1">
            <span class="text-muted fw-bold small text-uppercase"><i class="bi bi-graph-up-arrow me-1"></i> Espaços Mais
              Requisitados</span>
          </div>

          <div class="col-md-4">
            <div
              class="stat-card p-3 rounded-3 d-flex justify-content-between align-items-center border bg-white bg-opacity-50">
              <span class="fw-semibold text-secondary"><i class="bi bi-building me-2 text-primary"></i>Auditório -
                Sede</span>
              <span class="badge bg-primary rounded-pill fs-6 shadow-sm">12</span>
            </div>
          </div>

          <div class="col-md-4">
            <div
              class="stat-card p-3 rounded-3 d-flex justify-content-between align-items-center border bg-white bg-opacity-50">
              <span class="fw-semibold text-secondary"><i class="bi bi-pc-display me-2 text-primary"></i>Lab. Info -
                Sede</span>
              <span class="badge bg-primary rounded-pill fs-6 shadow-sm">8</span>
            </div>
          </div>

          <div class="col-md-4">
            <div
              class="stat-card p-3 rounded-3 d-flex justify-content-between align-items-center border bg-white bg-opacity-50">
              <span class="fw-semibold text-secondary"><i class="bi bi-heart-pulse me-2 text-primary"></i>Lab. Info -
                Medicina</span>
              <span class="badge bg-primary rounded-pill fs-6 shadow-sm">3</span>
            </div>
          </div>
        </div>
      </section>

      <section id="secao-tabela" class="card shadow-sm border-0"
        style="background-color: var(--bg-card); backdrop-filter: blur(16px); border-radius: var(--radius-lg); overflow: hidden;">
        
        <!-- Cabeçalho com Contador Integrado -->
        <div class="card-header bg-transparent py-3 border-bottom d-flex align-items-center justify-content-between">
          <h2 class="h5 m-0 fw-bold text-secondary text-start d-flex align-items-center gap-2">
            <i class="bi bi-table"></i> Agendamentos Encontrados
            <span id="contador-agendamentos" class="badge bg-primary rounded-pill fs-6 ms-2">0</span>
          </h2>
        </div>

        <div class="card-body p-0">
          <div class="table-responsive">
            <table id="tabela-agendamentos" class="table table-hover align-middle mb-0 text-start">
              <thead class="table-dark">
                <tr>
                  <th class="p-3">Nome (E-mail)</th>
                  <th>Tipo</th>
                  <th>Sala</th>
                  <th>Data/Hora</th>
                  <th>Finalidade</th>
                  <th>Solicitações</th>
                  <th>Observação</th>
                  <th>Status</th>
                  <th class="text-center">Ações</th>
                </tr>
              </thead>
              <tbody id="corpo-tabela-dados">
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </main>
  </div>

  <footer class="mt-5 p-3 text-center text-muted">
    <p>© 2025 - AgendDev</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Caminhos Corrigidos -->
  <script src="../static/acessibilidade.js"></script>
  <script src="../static/admin.js"></script>
</body>

</html>
